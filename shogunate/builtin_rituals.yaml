- name: swift-strike
  description: A tight loop for enacting small changes in 地
  triggers:
    - manual: true
  inputs:
    edict_id:
      type: string
      required: true
  max_retries: 3
  background:
    - the edict details
  steps:
    - name: forging
      minister: forge
      act: |
        Implement the changes for the edict below.
        Focus on minimal, targeted changes to fulfill the intent.
      on_failure: retry
    - name: judging
      minister: judge
      given:
        - the manifests
        - "!just test"
      act: |
        If any tests were changed, you need to verify that were not weakened
        and that non trivial changes are justified by the edict.
        If tests fail, provide clear feedback for the Forge on what needs to be fixed.
        If changes are not covered by test, add the missing tests and write them so they ensure the changed code will always work.
        When judgement is done, call record_verdict
      depends_on: [forging]
      on_failure: goto
      on_failure_target: forging
    - name: censoring
      minister: sage
      given:
        - the manifests
        - the verdicts
      act: |
        Review the code changes for this edict.
        Verify adherence to Imperial Code and project conventions.
        Record precedents for any significant decisions.
        Veto if changes violate conventions or introduce risk.
      depends_on: [judging]
      on_failure: goto
      on_failure_target: forging
  then:
    - the edict awaits ruler's seal

- name: castle-siege
  description: "A medium complexity 地 change with planning"
  triggers:
    - manual: true
  inputs:
    edict_id:
      type: string
      required: true
  max_retries: 3
  background:
    - the edict details
  steps:
    - name: strategizing
      minister: strategist
      act: |
        Analyze the edict below and produce a technical Battle Plan.
        Break down the work into clear phases with dependencies.
        Identify risks and architectural decisions.
        End this step with a fresh crop of lings or zhengming
      on_failure: zhengming

    - name: forging
      minister: forge
      given:
        - the manifests
      act: |
        Execute the Battle Plan for edict {{ .edict_id }}.
        Implement changes according to the Strategist's design.
      depends_on: [strategizing]
      on_failure: retry

    - name: judgement
      minister: judge
      given:
        - the manifests
      act: |
        Run the Trials for the edict.
        Execute all tests and validate the Forge's work.
        If the Judge fails, the Forge must return to the anvil.
      then:
        - "!git diff"
        - record the judge's seal
      depends_on: [forging]
      on_failure: goto
      on_failure_target: forging

    - name: censorship
      minister: sage
      given:
        - the manifests
        - the verdicts
        - the earth status
      act: |
        Review the code changes in this ritual.
        Verify it adheres to the Imperial Code (project standards).
        Veto if the code violates conventions or introduces risk.
      then:
        - record the sage's seal
      depends_on: [judgement]
      on_failure: goto
      on_failure_target: forging
  then:
    - the edict awaits ruler's seal

- name: dawn-audience
  description: "Startup ritual - Chancellor reports court status on Shogunate boot, then requests zhengming"
  max_retries: 2
  triggers:
    - event: shogunate_started
  steps:
    - name: ping-model
      minister: chancellor
      act: |
        this is a smoke test. please reply with `pong`
    - name: check-sandbox
      then:
        - the sandbox is healthy
    - name: check-asimi-version
      given:
        - Asimi's versions
      out: |
        {{- if .asimi_version.has_update }}
        ⚠ Update available: {{ .asimi_version.latest_version }} (current {{ .asimi_version.current_version }}) — run :update
        {{- else }}
        Running latest Asimi version {{ .asimi_version.current_version }}
        {{- end }}
    - name: summarize-and-next
      on_failure: retry
      minister: chancellor
      given:
        - the unsealed edicts
        - a heaven's snapshot
        - the earth status
        - the court status
      act: |
        Given the information below, provide a succinct report on 三界.
        finish by calling request_zhengming with a single question: "best path forward?" with
        a few options for a clear next step. e.g, "commit middle kingdom", "review borderlands".
        
- name: review-borderland
  description: |
    Code review - judge and sage review the borderlands before
    staging
  triggers:
    - manual: true
  background:
    - the borderlands
  steps:
    - name: judgement
      minister: judge
      act: |
        If the tests pass, ensure 
        the changes in the borderlands and middle kingdom are covered by tests.
        Censoring is next so don't stage, commit nor push. 
    - name: censoring
      minister: sage
      act: |
        Review the manifests and the code changes below.
        Check for style violations, security concerns, and architectural issues.
        Record your insights using record_precedent.
        Produce a comprehensive code review report summarizing findings from both judge and sage.
        Highlight any blocking issues and suggest improvements.

- name: lint-fix
  description: "Fix linter errors in parallel using fork/join"
  triggers:
    - manual: true
  max_retries: 2
  background:
    - the earth status
  steps:
    - name: lint
      minister: forge
      act: |
        Run the linter (just lint) and parse the output to extract a list of files with errors.
        Return a JSON array of objects with format: [{"file": "path/to/file.go", "errors": ["error1", "error2"]}]
      then:
        - the edict is blocked

    - name: fix-all-files
      fork:
        over: lint
        batch_size: 5
      work:
        - name: fix-file
          minister: forge
          act: |
            Fix all linter errors in file {{ .item.file }}.
            The errors to fix are: {{ .item.errors }}.
            Make minimal, targeted changes to resolve each error.
        - name: verify-file
          minister: judge
          act: |
            Run tests for file {{ .item.file }} to ensure the fixes don't break anything.
            If tests fail, retry the fix.
          on_failure: retry
          on_failure_target: fix-file

    - name: commit-all
      minister: forge
      given:
        - the earth status
      act: |
        Stage all changes and commit them together using git magic to exclude this commit from blame.
        Use: git add -A && git commit -m "Fix linter errors" --author="Asimi Linter <asimi@local>"
        Or use git commit-tree for advanced blame exclusion.
      depends_on: [fix-all-files]
  then:
    - the edict is unblocked
    - record the judge's seal
    - the edict awaits the ruler's seal

- name: project-init
  description: "Initialize a project for Asimi - establishes infrastructure and validates through the seal chain"
  triggers:
    - manual: true
  inputs:
    clearMode:
      type: boolean
      required: false
      default: false
    agentsFile:
      type: string
      required: false
      default: "AGENTS.md"
  max_retries: 2
  background:
    - a clear working directory
  steps:
    - name: establish-infrastructure
      minister: forge
      given:
        - the project metadata
        - the infrastructure templates
      act: |
        Customize the infrastructure template files IN PLACE. Do NOT rewrite files from scratch —
        use file_edit to modify specific lines while keeping all existing recipes and structure.
        Customize for this project:
        - Justfile: Set PROJECT_NAME := "{{.project_slug}}", fill in TBD recipes. KEEP the build-sandbox and clean-sandbox recipes unchanged.
        - .agents/asimi.conf: Set image_name = "localhost/asimi-sandbox-{{.project_slug}}:latest"
        - .agents/sandbox/Dockerfile: Replace CHANGE_ME with detected language base image (e.g. ruby:3.2, golang:1.22, python:3.12)
        - .agents/sandbox/bashrc: Adjust for project needs. Set URLs pointing to local host port XYZ to host.containers.internal:XYZ
        - {{.agentsFile}}: Add language and build conventions
        Detect primary language from codebase (Gemfile→ruby, go.mod→go, requirements.txt→python).
        Report what files were customized.
        - If the sandbox requires an a env var add it to .agents/asimi.conf. For example, when install from gitlab.com fails, add to the `sandbox` section `passthrough_env = ["GITLAB_TOKEN"]`
        - If the only thing left is to build the sandbox, finish and it'll be built
      then:
        - build the sandbox
      on_failure: retry

    - name: sandbox-ready
      minister: judge
      act: |
        Verify the sandbox infrastructure is sound by running tests.
        
        If tests or lint fail, the infrastructure is broken.
        Provide clear feedback on what must be fixed.
        
        If verification passes, record the Judge's Seal.
      depends_on: [establish-infrastructure]
      then:
        - the sandbox is ready
      on_failure: goto
      on_failure_target: establish-infrastructure

    - name: sage-reviews
      minister: sage
      given:
        - the earth status
        - the verdicts
      act: |
        Review the infrastructure files for quality and convention adherence.
        
        Verify:
        - {{.agentsFile}} follows project conventions
        - Justfile commands are idiomatic
        - Dockerfile is secure and minimal
        - No hardcoded paths or secrets
        
        Record precedents for any new conventions established.
        
        If review passes, record the Sage's Seal.
      depends_on: [sandbox-ready]
      on_failure: goto
      on_failure_target: establish-infrastructure
      then:
        - record the sage's seal
        - the infrastructure is staged
