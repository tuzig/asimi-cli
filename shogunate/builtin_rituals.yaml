- name: new
  description: "Session startup - review current state and await commands"
  triggers:
    - manual: true
  background:
    - "!echo '**The Borderlands**'"
    - "!git diff"
    - "!echo '**The middle kingdom**'"
    - "!git diff --cached"
  steps:
    - name: review
      minister: chancellor
      act: |
        Review the diff in the scratchpad:
        - If there are changes in progress, help the user resolve them
        (rename the current edict to: "committing ..." and invoke the fitting ritual).
        - If there are no changes, Welcome the ruler
 
- name: swift-strike
  description: A tight loop for enacting small changes in 地
  triggers:
    - manual: true
  inputs:
    edict_id:
      type: string
      required: true
  max_retries: 3
  background:
    - the edict details
  steps:
    - name: forge
      minister: forge
      act: |
        Implement the changes for edict {{ .edict_id }}.
        Focus on minimal, targeted changes to fulfill the intent.
      on_failure: retry
    - name: judge
      minister: judge
      given:
        - the manifests
        - '!just test'
      act: |
        If tests fail, provide clear feedback for the Forge.
        if they pass ensure the changes in the manifest are covered by tests
        that ensure the change will ALWAYS work
      depends_on: [forge]
      on_failure: goto
      on_failure_target: forge
  then:
    - the edict is sealed

- name: castle-siege
  description: "A medium complexity 地 change with planning"
  triggers:
    - manual: true
  inputs:
    edict_id:
      type: string
      required: true
  max_retries: 3
  background:
    - the edict details
  steps:
    - name: strategist
      minister: strategist
      act: |
        Analyze edict {{ .edict_id }} and produce a technical Battle Plan.
        Break down the work into clear phases with dependencies.
        Identify risks and architectural decisions.
      then:
        - the ruler approves
      on_failure: zhengming

    - name: forge
      minister: forge
      given:
        - the manifests
      act: |
        Execute the Battle Plan for edict {{ .edict_id }}.
        Implement changes according to the Strategist's design.
      depends_on: [strategist]
      on_failure: retry

    - name: judge
      minister: judge
      given:
        - the manifests
      act: |
        Run the Trials for edict {{ .edict_id }}.
        Execute all tests and validate the Forge's work.
        If the Judge fails, the Forge must return to the anvil.
      then:
        - "!git diff"
      depends_on: [forge]
      on_failure: goto
      on_failure_target: forge

    - name: censor
      minister: censor
      given:
        - the manifests
        - the verdicts
        - The earth status
      act: |
        Review the implemented code in this ritual.
        Verify it adheres to the Imperial Code (project standards).
        Veto if the code violates conventions or introduces risk.
      depends_on: [judge]
      on_failure: goto
      on_failure_target: strategist
  then:
    - the edict is sealed

- name: wakeup
  description: "Startup ritual - report court status on Shogunate boot"
  max_retries: 2
  triggers:
    - event: shogunate_started
  steps:
    - name: earth-status
      minister: chancellor
      on_failure: retry
      given:
        - the earth status
      act: |
        Provide a succinct report on earth status.
        List recent changes in the capital and 
        changes to the middle kingdom and the borderlands.
    - name: court-status
      minister: chancellor
      on_failure: retry
      given:
        - the court status
      act: |
        Summarize active edicts, rituals and manifests.
        End your task by calling the request_zhengming with a single question "best path forward?" and some options

- name: review
  description: |
    Code review - judge and censor review the changes before
    committing and suggesting the next steps
  triggers:
    - manual: true
  background:
    - the earth status
    - "!git diff"
  steps:
    - name: judge
      minister: judge
      act: |
        If the tests pass, ensure 
        the changes in the borderlands and middle kingdom are covered by tests
    - name: censor
      minister: censor
      act: |
        Review the given changes for quality and standards compliance.
        Check for style violations, security concerns, and architectural issues.
      depends_on: [judge]

    - name: report
      minister: confucius
      act: |
        Produce a comprehensive code review report.
        Summarize the findings from the judge and censor.
        Highlight any blocking issues and suggest improvements.
      depends_on: [censor]

- name: report_failure
  description: "Report ritual failure after retry exhaustion"
  triggers:
    - event: ritual_failed
  background:
    - the edict details
    - the court status
  steps:
    - name: report
      minister: chancellor
      act: |
        A ritual has failed after exhausting all retries for edict {{ .edict_id }}.
        Analyze the failure and suggest next steps.
        Consider requesting zhengming if the path forward is unclear.

- name: lint-fix
  description: "Fix linter errors in parallel using fork/join"
  triggers:
    - manual: true
  max_retries: 2
  background:
    - the earth status
  steps:
    - name: lint
      minister: forge
      act: |
        Run the linter (just lint) and parse the output to extract a list of files with errors.
        Return a JSON array of objects with format: [{"file": "path/to/file.go", "errors": ["error1", "error2"]}]
      then:
        - the edict is blocked

    - name: fix-all-files
      fork:
        over: lint
        batch_size: 5
      work:
        - name: fix-file
          minister: forge
          act: |
            Fix all linter errors in file {{ .item.file }}.
            The errors to fix are: {{ .item.errors }}.
            Make minimal, targeted changes to resolve each error.
        - name: verify-file
          minister: judge
          act: |
            Run tests for file {{ .item.file }} to ensure the fixes don't break anything.
            If tests fail, retry the fix.
          on_failure: retry
          on_failure_target: fix-file

    - name: commit-all
      minister: forge
      given:
        - the earth status
      act: |
        Stage all changes and commit them together using git magic to exclude this commit from blame.
        Use: git add -A && git commit -m "Fix linter errors" --author="Asimi Linter <asimi@local>"
        Or use git commit-tree for advanced blame exclusion.
      depends_on: [fix-all-files]
  then:
    - the edict is unblocked
    - the edict is sealed
