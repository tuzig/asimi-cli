- name: new
  description: "Session startup - review current state and await commands"
  triggers:
    - manual: true
  background:
    - "!echo '**The Borderlands**'"
    - "!git diff"
    - "!echo '**The middle kingdom**'"
    - "!git diff --cached"
  steps:
    - name: review
      minister: chancellor
      act: |
        Review the diff in the scratchpad:
        - If there are changes in progress, help the user resolve them
        (rename the current edict to: "committing ..." and invoke the fitting ritual).
        - If there are no changes, Welcome the ruler
 
- name: swift-strike
  description: A tight loop for enacting small changes in 地
  triggers:
    - manual: true
  inputs:
    edict_id:
      type: string
      required: true
  max_retries: 3
  background:
    - the edict details
  steps:
    - name: forge
      minister: forge
      act: |
        Implement the changes for edict {{ .edict_id }}.
        Focus on minimal, targeted changes to fulfill the intent.
      on_failure: retry
    - name: judge
      minister: judge
      given:
        - the manifests
        - '!just test'
      act: |
        If tests fail, provide clear feedback for the Forge.
        if they pass ensure the changes in the manifest are covered by tests
        that ensure the change will ALWAYS work
      depends_on: [forge]
      on_failure: goto
      on_failure_target: forge
  then:
    - the edict is sealed

- name: castle-siege
  description: "A medium complexity 地 change with planning"
  triggers:
    - manual: true
  inputs:
    edict_id:
      type: string
      required: true
  max_retries: 3
  background:
    - the edict details
  steps:
    - name: strategist
      minister: strategist
      act: |
        Analyze edict {{ .edict_id }} and produce a technical Battle Plan.
        Break down the work into clear phases with dependencies.
        Identify risks and architectural decisions.
      then:
        - the ruler approves
      on_failure: zhengming

    - name: forge
      minister: forge
      given:
        - the manifests
      act: |
        Execute the Battle Plan for edict {{ .edict_id }}.
        Implement changes according to the Strategist's design.
      depends_on: [strategist]
      on_failure: retry

    - name: judge
      minister: judge
      given:
        - the manifests
      act: |
        Run the Trials for edict {{ .edict_id }}.
        Execute all tests and validate the Forge's work.
        If the Judge fails, the Forge must return to the anvil.
      then:
        - "!git diff"
      depends_on: [forge]
      on_failure: goto
      on_failure_target: forge

    - name: censor
      minister: censor
      given:
        - the manifests
        - the verdicts
        - The earth status
      act: |
        Review the implemented code in this ritual.
        Verify it adheres to the Imperial Code (project standards).
        Veto if the code violates conventions or introduces risk.
      depends_on: [judge]
      on_failure: goto
      on_failure_target: strategist
  then:
    - the edict is sealed

- name: wakeup
  description: "Startup ritual - report court status on Shogunate boot"
  max_retries: 2
  triggers:
    - event: shogunate_started
  background:
    - the earth status
    - the court status
  steps:
    - name: current-n-next
      minister: chancellor
      on_failure: retry
      act: |
        The Shogunate is starting up.
        Start by reporting the current 三界 status.
        List changes to the middle kingdom and the borderlands.
        Summarize active edicts, rituals and manifests.
        End your task by calling the request_zhengming, proposing to the ruler some paths forward

- name: review
  description: |
    Code review - judge and censor review the changes before
    committing and suggesting the next steps
  triggers:
    - manual: true
  background:
    - the earth status
    - "!git diff"
  steps:
    - name: judge
      minister: judge
      act: |
        If the tests pass, ensure 
        the changes in the borderlands and middle kingdom are covered by tests
    - name: censor
      minister: censor
      act: |
        Review the given changes for quality and standards compliance.
        Check for style violations, security concerns, and architectural issues.
      depends_on: [judge]

    - name: report
      minister: confucius
      act: |
        Produce a comprehensive code review report.
        Summarize the findings from the judge and censor.
        Highlight any blocking issues and suggest improvements.
      depends_on: [censor]

- name: report_failure
  description: "Report ritual failure after retry exhaustion"
  triggers:
    - event: ritual_failed
  background:
    - the edict details
    - the court status
  steps:
    - name: report
      minister: chancellor
      act: |
        A ritual has failed after exhausting all retries for edict {{ .edict_id }}.
        Analyze the failure and suggest next steps.
        Consider requesting zhengming if the path forward is unclear.
