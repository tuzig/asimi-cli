# Example configuration showing port mirroring for Redis tests
[sandbox]
# Mirror Redis port (6379) from host to container
# This allows tests running on the host to connect to Redis in the container
port_mirroring = [6379]

# Additional examples:
# port_mirroring = [6379, 8080, 5432]  # Multiple ports
# port_mirroring = [3000]              # Web app port
# port_mirroring = [27017]             # MongoDB port

# Other sandbox configuration
image_name = "localhost/asimi-sandbox-myproject:latest"
timeout_minutes = 10
allow_host_fallback = true