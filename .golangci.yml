version: 2

# Phase 1: Minimal linter set — catches real bugs with low false-positive rate.
# Additional linters (errcheck, gosec, revive, misspell, unconvert, unparam)
# will be added in later phases as the codebase is cleaned up.

run:
  timeout: 5m
  modules-download-mode: vendor

linters:
  default: none
  enable:
    - govet         # reports suspicious constructs
    - ineffassign   # detect ineffectual assignments
    - staticcheck   # go vet on steroids
    - unused        # check for unused constants, variables, functions and types

  settings:
    govet:
      enable-all: true
      disable:
        - shadow  # can be too strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
